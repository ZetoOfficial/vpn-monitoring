all:
  vars:
    ansible_user: root

    # Where to bind the Grafana port. The wg-admin tunnel is gone; until a new
    # access path is designed (UFW source-IP, SSH tunnel, or Alloy push),
    # Grafana binds to localhost and you reach it via `ssh -L 3000:127.0.0.1:3000`.
    grafana_bind_ip: "127.0.0.1"
    grafana_admin_user: admin
    grafana_admin_password: "replace-with-local-secret"

    prometheus_retention: 15d
    prometheus_retention_size: 2GB
    prometheus_scrape_interval: 30s
    monitoring_base_dir: /opt/monitoring
    monitoring_repo_dir: "{{ playbook_dir }}/../../monitoring"

  children:
    monitoring:
      hosts:
        vdsina_monitoring:
          ansible_host: "203.0.113.10"
          # Per-host list of additional public TCP ports to keep accessible
          # after UFW is enabled. Empty = no extras.
          existing_public_tcp_ports: []

    # TODO(awg): AmneziaWG appliance hosts. The native AWG roles
    # (amneziawg, node_exporter, amneziawg_exporter, awg_peer_exporter,
    # backups) will target this group once they are written.
    awg_servers:
      hosts: {}
