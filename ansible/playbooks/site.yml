---
- name: AmneziaWG appliance + observability (single host)
  hosts: awg_servers
  become: true
  roles:
    - common
    - amneziawg        # installs AWG, sets awg_port; must precede firewall
    - reconcile        # fail loudly if install-time settings drifted from inventory
    - firewall         # opens SSH + awg_port UDP
    - awg_clients      # reconciles declared permanent peers
    - node_exporter
    - awg_peer_exporter
    - amneziawg_exporter
    - docker           # runtime for the observability stack
    - monitoring_stack # docker-compose Prometheus + Grafana (host network)
