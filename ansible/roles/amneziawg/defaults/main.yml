---
awg_installer_version: "v5.15.3"
awg_interface: "awg0"
awg_dir: "/root/awg"
awg_manage_script: "{{ awg_dir }}/manage_amneziawg.sh"
awg_server_conf: "/etc/amnezia/amneziawg/awg0.conf"

awg_port: 51820
# Public endpoint baked into generated client configs. Set to your domain
# (e.g. vpn.example.com) so clients survive a host/IP migration — repoint DNS +
# restore backup, no client reissue. Empty = installer uses the server IP.
awg_endpoint: ""
awg_tunnel_subnet: "10.9.9.1/24"
awg_route_mode: "amnezia"        # all | amnezia | custom
awg_route_custom_nets: ""
awg_disable_ipv6: true
awg_preset: "default"            # default | mobile
awg_ssh_port: 22
awg_installer_extra_args: ""
