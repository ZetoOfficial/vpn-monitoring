---
# Installs AmneziaWG via the pinned bivlked installer, driven non-interactively.
# On a fresh host the installer runs in steps and reboots between them (kernel
# module / DKMS), tracking progress in /root/awg/setup_state and resuming on
# re-run. We therefore loop: run installer (tolerating the reboot-induced
# unreachable) -> wait for the host -> repeat, until the manage script appears.
# The `creates:` guard makes passes after completion a no-op.

- name: Build AmneziaWG installer flags
  ansible.builtin.set_fact:
    _awg_installer_flags: >-
      --yes
      --port={{ awg_port }}
      --subnet={{ awg_tunnel_subnet }}
      {{ '--disallow-ipv6' if awg_disable_ipv6 else '--allow-ipv6' }}
      {% if awg_route_mode == 'all' %}--route-all
      {% elif awg_route_mode == 'custom' %}--route-custom={{ awg_route_custom_nets }}
      {% else %}--route-amnezia
      {% endif %}
      --preset={{ awg_preset }}
      --ssh-port={{ awg_ssh_port }}
      {% if awg_endpoint | default('') | length > 0 %}--endpoint={{ awg_endpoint }}
      {% endif %}
      {{ awg_installer_extra_args }}

- name: Download pinned AmneziaWG installer
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/bivlked/amneziawg-installer/{{ awg_installer_version }}/install_amneziawg_en.sh"
    dest: /root/install_amneziawg_en.sh
    mode: "0700"

- name: Install AmneziaWG (idempotent; tolerates reboots between installer steps)
  ansible.builtin.include_tasks: install_attempt.yml
  loop: "{{ range(1, awg_install_max_attempts + 1) | list }}"
  loop_control:
    loop_var: _awg_attempt
    label: "attempt {{ _awg_attempt }}/{{ awg_install_max_attempts }}"

- name: Check the manage script is present
  ansible.builtin.stat:
    path: "{{ awg_manage_script }}"
  register: _awg_manage_stat

- name: Assert AmneziaWG install completed
  ansible.builtin.assert:
    that:
      - _awg_manage_stat.stat.exists
    fail_msg: >-
      AmneziaWG install incomplete after {{ awg_install_max_attempts }} passes:
      {{ awg_manage_script }} is missing. Inspect {{ awg_dir }}/install_amneziawg.log.

- name: Health-check — interface is up
  ansible.builtin.command: "awg show {{ awg_interface }}"
  register: _awg_show
  changed_when: false

- name: Health-check — manage script reports OK
  ansible.builtin.command: "bash {{ awg_manage_script }} --no-color check"
  register: _awg_check
  changed_when: false
  failed_when: _awg_check.rc != 0

# The installer only sets the endpoint on first install (behind the creates
# guard). Keep AWG_ENDPOINT in sync on every run so NEW clients pick up the
# configured endpoint even if awg_endpoint changed after install. (Existing
# clients are reconciled by the awg_clients role.)
- name: Keep AWG_ENDPOINT in sync with awg_endpoint
  ansible.builtin.lineinfile:
    path: "{{ awg_dir }}/awgsetup_cfg.init"
    regexp: '^export AWG_ENDPOINT='
    line: "export AWG_ENDPOINT='{{ awg_endpoint }}'"
  when: awg_endpoint | default('') | length > 0
