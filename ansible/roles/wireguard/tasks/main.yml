---
- name: WireGuard backend (coexists with AmneziaWG)
  when: wireguard_enabled | default(false)
  block:
    - name: Install wireguard-tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: Ensure WireGuard dir
      ansible.builtin.file:
        path: "{{ wg_dir }}"
        state: directory
        mode: "0700"

    - name: Ensure server + client keys exist; emit key material (JSON)
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ wg_dir }}
        umask 077
        [ -f server_private.key ] || wg genkey > server_private.key
        [ -f server_public.key ]  || wg pubkey < server_private.key > server_public.key
        mkdir -p clients
        i={{ wg_client_ip_base }}
        printf '{"server":{"priv":"%s","pub":"%s"},"clients":{' "$(cat server_private.key)" "$(cat server_public.key)"
        first=1
        for name in {{ wg_clients | map(attribute='name') | join(' ') }}; do
          [ -f "clients/$name.key" ] || wg genkey > "clients/$name.key"
          [ -f "clients/$name.pub" ] || wg pubkey < "clients/$name.key" > "clients/$name.pub"
          [ $first -eq 0 ] && printf ','
          printf '"%s":{"priv":"%s","pub":"%s","ip":"10.10.0.%s"}' "$name" "$(cat clients/$name.key)" "$(cat clients/$name.pub)" "$i"
          first=0; i=$((i+1))
        done
        printf '}}'
      args:
        executable: /bin/bash
      register: _wg_keys
      changed_when: false
      no_log: true

    - name: Load key material
      ansible.builtin.set_fact:
        _wg: "{{ _wg_keys.stdout | from_json }}"
      no_log: true

    - name: Render server config
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: "{{ wg_dir }}/{{ wg_interface }}.conf"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart wireguard

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: started
        enabled: true
        daemon_reload: true

    - name: Render client configs
      ansible.builtin.template:
        src: client.conf.j2
        dest: "{{ wg_dir }}/clients/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ wg_clients }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # --- wg peer exporter (textfile) for A/B vs AmneziaWG ---
    - name: Install wg-peer-exporter script
      ansible.builtin.template:
        src: wg-peer-exporter.sh.j2
        dest: /usr/local/bin/wg-peer-exporter
        owner: root
        group: root
        mode: "0755"

    - name: Install wg-peer-exporter service + timer
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - wg-peer-exporter.service.j2
        - wg-peer-exporter.timer.j2

    - name: Enable and start wg-peer-exporter timer
      ansible.builtin.systemd:
        name: wg-peer-exporter.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Prime wg metrics once
      ansible.builtin.command: /usr/local/bin/wg-peer-exporter
      changed_when: false

    - name: Fetch client configs to control machine
      ansible.builtin.fetch:
        src: "{{ wg_dir }}/clients/{{ item.name }}.conf"
        dest: "{{ wg_config_fetch_dir }}/"
        flat: true
      loop: "{{ wg_clients }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
