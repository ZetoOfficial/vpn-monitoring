---
- name: WireGuard backend (coexists with AmneziaWG)
  when: wireguard_enabled | default(false)
  block:
    - name: Install wireguard-tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true

    - name: Ensure WireGuard dir
      ansible.builtin.file:
        path: "{{ wg_dir }}"
        state: directory
        mode: "0700"

    - name: Install wg-client manager
      ansible.builtin.template:
        src: wg-client.sh.j2
        dest: /usr/local/bin/wg-client
        owner: root
        group: root
        mode: "0755"

    - name: Bootstrap wg config (interface only; peers owned by wg-client)
      ansible.builtin.command: wg-client init
      register: _wg_init
      changed_when: "'created' in _wg_init.stdout"

    - name: Enable and start WireGuard
      ansible.builtin.systemd:
        name: "wg-quick@{{ wg_interface }}"
        state: started
        enabled: true
        daemon_reload: true

    # Additive reconcile: ensure declared peers exist (wg-client skips existing
    # and never removes CLI-managed peers). Mirrors the awg_clients model.
    - name: Ensure declared WireGuard peers exist
      ansible.builtin.command: "wg-client add {{ item.name }}"
      loop: "{{ wg_clients | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: _wg_add
      changed_when: "'added' in _wg_add.stdout"

    # --- wg peer exporter (textfile) for A/B vs AmneziaWG ---
    - name: Install wg-peer-exporter script
      ansible.builtin.template:
        src: wg-peer-exporter.sh.j2
        dest: /usr/local/bin/wg-peer-exporter
        owner: root
        group: root
        mode: "0755"

    - name: Install wg-peer-exporter service + timer
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - wg-peer-exporter.service.j2
        - wg-peer-exporter.timer.j2

    - name: Enable and start wg-peer-exporter timer
      ansible.builtin.systemd:
        name: wg-peer-exporter.timer
        state: started
        enabled: true
        daemon_reload: true

    - name: Prime wg metrics once
      ansible.builtin.command: /usr/local/bin/wg-peer-exporter
      changed_when: false

    - name: Fetch declared client configs to control machine
      ansible.builtin.fetch:
        src: "{{ wg_dir }}/clients/{{ item.name }}.conf"
        dest: "{{ wg_config_fetch_dir }}/"
        flat: true
      loop: "{{ wg_clients }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
