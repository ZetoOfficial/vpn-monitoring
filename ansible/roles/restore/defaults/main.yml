---
awg_dir: "/root/awg"
awg_manage_script: "{{ awg_dir }}/manage_amneziawg.sh"
awg_interface: "awg0"

# Control-machine private key used to decrypt; never copied to the host.
backup_age_identity: "~/.config/awg-backup/age.key"
# Path (control machine, relative to where ansible runs) to a .age archive.
backup_file: ""
