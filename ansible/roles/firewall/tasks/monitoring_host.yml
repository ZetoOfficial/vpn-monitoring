---
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow admin WireGuard
  community.general.ufw:
    rule: allow
    port: "{{ admin_wg_port }}"
    proto: udp

- name: Keep legacy WireGuard UDP ports open during migration
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ legacy_wg_udp_ports | default([]) }}"

- name: Enable UFW on monitoring host
  community.general.ufw:
    state: enabled
