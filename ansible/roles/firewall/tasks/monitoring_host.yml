---
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Keep existing public TCP ports open
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ existing_public_tcp_ports | default([]) }}"

- name: Enable UFW on monitoring host
  community.general.ufw:
    state: enabled
