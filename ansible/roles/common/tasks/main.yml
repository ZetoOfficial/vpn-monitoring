---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - gnupg
      - lsb-release
      - git
      - jq
      - unzip
      - tar
      - python3
      - python3-venv
      - python3-pip
      - qrencode        # manage_amneziawg.sh generates client QR codes
      - moreutils       # sponge — atomic textfile-collector writes
      - ufw
    state: present
