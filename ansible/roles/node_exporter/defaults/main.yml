---
node_exporter_version: "1.8.2"
node_exporter_listen_ip: "127.0.0.1"
node_exporter_port: 9100
node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"
node_exporter_user: "node_exporter"
# Maps Ansible's architecture fact to the release asset suffix.
node_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
