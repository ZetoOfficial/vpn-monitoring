---
# Declarative reconcile of PERMANENT peers. `--json` keeps stdout pure JSON
# (logs go to stderr). `add` is idempotent server-side, but we diff first so
# Ansible reports `changed` accurately and skips a needless config apply.
- name: List current AmneziaWG peers (JSON)
  ansible.builtin.command: "bash {{ awg_manage_script }} --no-color --json list"
  register: _awg_list
  changed_when: false

- name: Collect existing peer names
  ansible.builtin.set_fact:
    _awg_existing_peers: "{{ (_awg_list.stdout | from_json) | map(attribute='name') | list }}"

- name: Build tunnel-ping target list (declared peers with tunnel_ping + a tunnel IP)
  ansible.builtin.set_fact:
    awg_peer_targets: >-
      {{ (_awg_list.stdout | from_json)
         | selectattr('name', 'in', awg_clients | selectattr('tunnel_ping', 'defined')
                                                 | selectattr('tunnel_ping')
                                                 | map(attribute='name') | list)
         | selectattr('ip', 'defined')
         | rejectattr('ip', 'equalto', '')
         | list }}

- name: Add missing permanent peers
  ansible.builtin.command: "bash {{ awg_manage_script }} --no-color --yes add {{ item.name }}"
  loop: "{{ awg_clients | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in _awg_existing_peers
  register: _awg_add
  changed_when: _awg_add.rc == 0
  no_log: true

# Make awg_endpoint declarative: bring each declared client's Endpoint to
# <awg_endpoint>:<awg_port>, regenerating only the ones that differ. Idempotent —
# a re-run with an unchanged endpoint makes no changes.
- name: Ensure declared clients use the configured endpoint
  ansible.builtin.shell: |
    set -e
    conf="{{ awg_dir }}/{{ item.name }}.conf"
    [ -f "$conf" ] || exit 0
    want="Endpoint = {{ awg_endpoint }}:{{ awg_port }}"
    cur="$(grep '^Endpoint' "$conf" 2>/dev/null || true)"
    if [ "$cur" != "$want" ]; then
      bash {{ awg_manage_script }} --no-color modify "{{ item.name }}" Endpoint "{{ awg_endpoint }}:{{ awg_port }}" >/dev/null 2>&1
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  loop: "{{ awg_clients | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: awg_endpoint | default('') | length > 0
  register: _awg_ensure_ep
  changed_when: "'CHANGED' in (_awg_ensure_ep.stdout | default(''))"
  no_log: true
